name: CI
on:
  pull_request:
  push:
    branches: [ main, dev ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: pytest -q
