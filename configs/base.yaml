seed: 42
env:
  id: predator_prey_v0
  grid_size: 7
  n_predators: 2
  n_prey: 2
  max_steps: 200
train:
  algo: ppo
  total_episodes: 500
  gamma: 0.99
  gae_lambda: 0.95
  use_gae: true
  lr: 3.0e-4
  batch_size: 2048
  minibatch_size: 1024
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  hidden: 128
evolve:
  generations: 20
  pop_size: 12
  elitism: 2
  tournament_k: 3
  mutation_sigma: 0.05
  mutation_p: 1.0
  crossover_mode: uniform   # uniform | blend | layer
  crossover_rate: 0.5
  novelty_coef: 0.0         # set > 0 to blend novelty into selection
  novelty_k: 5
  novelty_capacity: 500
  eval_episodes: 2
logging:
  save_dir: artifacts/
  csv: true
  plots: true
  plot_every: 50
recording:
  enabled: false
  sample_rate: 1
