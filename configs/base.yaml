seed: 42
env:
  id: predator_prey_v0
  grid_size: 7          # unused for MPE simple_tag (kept for the future grid env)
  n_predators: 2
  n_prey: 2
  max_steps: 200
train:
  algo: ppo
  total_episodes: 500
  device: auto              # cpu | cuda | mps | auto
  gamma: 0.99
  gae_lambda: 0.95
  lr: 3.0e-4
  batch_size: 2048
  minibatch_size: 256
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: 128
logging:
  save_dir: artifacts/
  csv: true
  plots: true
  plot_every: 50
recording:
  enabled: false
  sample_rate: 1
novelty:
  enabled: false            # per-team behavior-characteristic novelty
  capacity: 500             # sliding archive size
  k: 15                     # k-NN for novelty scoring
  bonus_coef: 0.0           # >0 adds novelty * coef as intrinsic reward
checkpoint:
  enabled: true
  every: 0                  # 0 = only at end; N = every N episodes
