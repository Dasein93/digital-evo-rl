seed: 0
env:
  id: predator_prey_v0
  n_predators: 1
  n_prey: 1
  max_steps: 20
train:
  algo: ppo
  total_episodes: 3
  gamma: 0.99
  gae_lambda: 0.95
  lr: 3.0e-4
  batch_size: 256
  minibatch_size: 64
  update_epochs: 2
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: 32
logging:
  save_dir: artifacts/
  csv: true
  plots: true
  plot_every: 1
recording:
  enabled: true
  sample_rate: 1
novelty:
  enabled: true
  capacity: 32
  k: 3
  bonus_coef: 0.0
checkpoint:
  enabled: true
  every: 0
qd:
  enabled: true
  every: 1
  fitness_window: 2
  bc_dims: [0, 3]
  bc_bounds: [[-2.0, 2.0], [0.0, 1.65]]
  grid_shape: [4, 4]
